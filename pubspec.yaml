repository: https://github.com/intersyntactic/annotation_shapes

environment:
  sdk: ^3.13.0

dependencies:
  is_shapes: ^0.2.0

dev_dependencies:
  analyzer: ^14.7.0
  lints: ^6.1.0
  test: ^1.33.0
