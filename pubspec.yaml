name: is_review_shapes
description: >-
  The shapes a person reviews with in intersyntactic: a comment, a
  correction, an approval, and the verdict a correction proposes.
version: 0.1.0
repository: https://github.com/intersyntactic/review_shapes

environment:
  sdk: ^3.13.0

dependencies:
  # A git dependency until is_shapes is published; then ^0.1.0.
  is_shapes:
    git:
      url: git@github.com:intersyntactic/shapes.git
      ref: first-release

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
